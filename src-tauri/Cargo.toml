[package]
name = "gitty"
version = "1.1.5"
description = "Gitty branch radar"
edition = "2021"

[features]
# 由 tauri.conf.json 的 build.features 启用；仅 macOS 会真正创建菜单栏图标
tray = ["tauri/tray-icon"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
window-vibrancy = "0.8"

# macOS 专用：NSScreen.visibleFrame 定位、NSWindow 层级（desktop level）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSScreen", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
