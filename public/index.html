<!doctype html>
<html lang="zh-CN" data-mode="local">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitty</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="radar" aria-live="polite">
      <header data-tauri-drag-region="deep">
        <div class="h-left">
          <div class="brand"><span class="brand-mark"></span><span>GITTY</span></div>
          <div class="repo-wrap">
            <button id="repo" class="repo" title="切换仓库"><span id="repo-label">正在读取仓库</span><i>▾</i></button>
            <div id="repo-menu" class="repo-menu" hidden data-tauri-drag-region="false">
              <div class="repo-menu-title">最近仓库</div>
              <div id="repo-list" class="repo-list"></div>
              <div class="repo-menu-input">
                <input id="repo-path" class="repo-path" placeholder="输入仓库路径（支持 ~），回车打开" />
                <button type="button" id="repo-browse" class="repo-browse" title="从文件管理器选择文件夹">浏览…</button>
              </div>
            </div>
          </div>
          <div id="wt" class="wt" hidden></div>
        </div>
        <div id="timeline" class="timeline" title="拖动查看历史，实心点是 release" data-tauri-drag-region="false">
          <svg class="tl-rule" aria-hidden="true"><line /></svg>
          <div id="tl-marks" class="tl-marks"></div>
          <div id="tl-view" class="tl-view"></div>
        </div>
        <div class="h-right">
          <div class="h-controls">
            <div class="shortcuts" aria-hidden="true"><kbd>T</kbd><span>视角</span><kbd>F</kbd><span>聚焦</span><kbd>R</kbd><span>刷新</span></div>
            <div class="fetch-group">
              <button id="fetch" class="tool-btn" title="git fetch --all --prune">FETCH</button>
              <button id="auto" class="tool-btn" title="每 60 秒自动 fetch">AUTO</button>
            </div>
            <button id="orient" class="tool-btn" title="切换到竖版">竖</button>
            <div id="orient-toggle" class="mode-toggle orient-toggle" data-active="h" role="group" aria-label="方向：横 / 竖">
              <span class="pill" aria-hidden="true"></span>
              <button type="button" data-orient="h" class="on" aria-pressed="true">横</button>
              <button type="button" data-orient="v" aria-pressed="false">竖</button>
            </div>
            <div id="notice" class="notice" hidden></div>
            <div class="mode-toggle" id="mode-toggle" data-active="local" role="group" aria-label="视角：本地 / 远端">
              <span class="pill" aria-hidden="true"></span>
              <button type="button" data-mode="local" class="on" aria-pressed="true">本地</button>
              <button type="button" data-mode="remote" aria-pressed="false">远端</button>
            </div>
          </div>
          <div id="status" class="status" title="已连接"></div>
        </div>
      </header>
      <section id="empty" class="empty">正在建立分支雷达…</section>
      <section id="graph" class="graph" hidden>
        <div id="scroll" class="scroll">
          <svg id="canvas" role="img" aria-label="Git 分支雷达">
            <!-- macOS/WKWebView 不渲染 SVG 组上的 CSS blur()，改用 SVG 滤镜 -->
            <defs id="filters">
              <filter id="gitty-blur-soft" x="-5%" y="-5%" width="110%" height="110%">
                <feGaussianBlur stdDeviation="1.4" />
              </filter>
              <filter id="gitty-blur-strong" x="-5%" y="-5%" width="110%" height="110%">
                <feGaussianBlur stdDeviation="2.4" />
              </filter>
            </defs>
            <defs id="defs"></defs>
            <g id="backRemote" class="layer back-remote"></g>
            <g id="backLocal" class="layer back-local"></g>
            <g id="backDots" class="layer back-dots"></g>
            <g id="panels" class="panels"></g>
            <g id="frontRemote" class="layer front-remote"></g>
            <g id="frontEdges" class="layer front-edges"></g>
            <g id="rings" class="rings"></g>
            <g id="frontDots" class="layer front-dots"></g>
            <g id="rebaseLinks" class="rebase-links"></g>
            <g id="chips" class="chips"></g>
          </svg>
          <div id="hits" class="hits"></div>
        </div>
      </section>
    </main>
    <div id="resize-w" class="resize-w" title="拖动调整竖版宽度"></div>
    <div id="resize-e" class="resize-e" title="拖动调整竖版宽度"></div>
    <div id="tip" class="tip" hidden></div>
    <div id="detail" class="detail" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
